<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宝夾町 · 營收分析表</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f4ef;        /* 米白和紙 */
  --surface:#ffffff;
  --surface2:#fbf9f4;
  --ink:#1c1814;       /* 墨黑 */
  --t2:#5c5147;
  --muted:#7a6e64;
  --faint:#9c9186;
  --border:#e2d9cc;
  --border2:#efe9df;
  --accent:#2d6a4f;    /* 深綠（主色）*/
  --accent-dk:#22513c;
  --accent-soft:#e8f1ec;
  --gold:#b8962e;      /* 金 */
  --gold-soft:#f6efdc;
  --red:#c0392b;       /* 紅 */
  --red-soft:#f8e8e6;
  --warn:#c4763a;      /* 橙土 */
  --warn-soft:#f9ecdf;
  --blue:#5f7e8c;      /* 藍鼠（輔助）*/
  --mono:'JetBrains Mono',monospace;
  --serif:'Noto Serif TC',serif;
}
html{font-size:16px}
body{min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',sans-serif;padding-bottom:48px;-webkit-font-smoothing:antialiased}

/* BACK BAR */
.back-bar{position:sticky;top:0;z-index:100;background:rgba(247,244,239,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:12px}
.back-btn{color:var(--muted);font-size:13px;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:6px 14px;cursor:pointer;font-family:inherit;transition:all .2s;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.back-btn:hover{color:var(--ink);border-color:var(--accent);color:var(--accent)}
.bar-title{font-size:14px;font-weight:700;color:var(--accent);letter-spacing:.5px}
.bar-sub{font-size:12px;color:var(--faint)}

/* HEADER */
.header{padding:28px 24px 0;max-width:1060px;margin:0 auto}
.header-inner{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:22px}
.brand-mark{display:flex;align-items:center;gap:13px;margin-bottom:6px}
.seal{width:46px;height:46px;border-radius:11px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:900;font-size:21px;letter-spacing:-2px;box-shadow:0 3px 0 var(--accent-dk);flex-shrink:0}
.h1{font-family:var(--serif);font-size:25px;font-weight:900;letter-spacing:.04em;line-height:1.1}
.h-sub{color:var(--muted);font-size:13px;margin-top:5px}
.h-sub b{color:var(--accent);font-weight:700}
.tabs{display:flex;gap:7px;flex-wrap:wrap}
.tab-btn{padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;border:1px solid var(--border);background:var(--surface);color:var(--muted);transition:all .2s;font-family:inherit}
.tab-btn:hover{border-color:var(--accent);color:var(--accent)}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 0 var(--accent-dk)}
.tab-btn.report-active{background:var(--gold-soft);color:var(--gold);border-color:var(--gold)}

/* KPI ROW */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:6px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:15px 17px;position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.kpi.k-gold::after{background:var(--gold)}
.kpi.k-warn::after{background:var(--warn)}
.kpi.k-blue::after{background:var(--blue)}
.kpi-lbl{color:var(--muted);font-size:12px;letter-spacing:.03em;margin-bottom:9px;display:flex;align-items:center;gap:7px}
.kpi-tag{font-family:var(--mono);font-size:9px;font-weight:700;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:1px 5px;color:var(--faint)}
.kpi-val{font-family:var(--mono);font-size:21px;font-weight:700;color:var(--ink);line-height:1}
.kpi-val .u{font-size:12px;color:var(--muted);font-weight:500;margin-right:2px}
.kpi-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.kpi-note{color:var(--faint);font-size:12px}
.kpi-diff{font-size:12px;font-weight:700;font-family:var(--mono)}
.kpi-diff.up{color:var(--accent)}
.kpi-diff.dn{color:var(--red)}

/* CONTENT */
.content{max-width:1060px;margin:0 auto;padding:18px 24px 0}
.panel{display:none}
.panel.active{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* CARD */
.card{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:20px;margin-bottom:15px}
.card-title{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.card-title .dot{width:8px;height:8px;border-radius:2px;background:var(--accent);flex-shrink:0}
.card-sub{font-size:12px;color:var(--muted);margin-bottom:16px}
.chart-wrap{position:relative;width:100%}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:15px}

/* PROGRESS / RANK BARS */
.rank{margin-bottom:11px}
.rank-lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.rank-name{color:var(--t2);font-weight:500}
.rank-val{font-family:var(--mono);color:var(--ink);font-weight:700}
.rank-bg{background:var(--border2);border-radius:5px;height:8px;overflow:hidden}
.rank-fill{height:100%;border-radius:5px;transition:width .6s ease}

/* SPOTS */
.spot-list{display:grid;gap:13px}
.spot{display:flex;gap:11px;align-items:flex-start}
.spot-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:6px}
.spot-lbl{font-size:13px;color:var(--ink);font-weight:600;margin-bottom:2px}
.spot-sub{font-size:12px;color:var(--muted);line-height:1.6}
.spot-sub b{font-family:var(--mono);color:var(--ink)}

/* MONTH PICK */
.mpick{display:flex;gap:7px;margin-bottom:16px;flex-wrap:wrap}
.m-btn{padding:6px 14px;border-radius:7px;cursor:pointer;font-size:13px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);font-family:inherit;transition:all .2s}
.m-btn.sel{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-dk);font-weight:700}
.m-btn:not(.sel):hover{border-color:var(--accent);color:var(--accent)}

/* TABLE */
.tbl-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
thead th{position:sticky;top:0;background:var(--surface2);text-align:right;color:var(--muted);font-size:11px;letter-spacing:.04em;padding:10px 13px;border-bottom:1px solid var(--border);font-weight:700;white-space:nowrap}
thead th:first-child{text-align:left}
tbody td{padding:9px 13px;border-bottom:1px solid var(--border2);text-align:right;font-family:var(--mono)}
tbody td:first-child{text-align:left;font-family:'Noto Sans TC',sans-serif;color:var(--t2);font-weight:500}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface2)}
tr.sum-row td{background:var(--accent-soft);font-weight:700;color:var(--accent-dk);border-top:2px solid var(--accent)}
tr.sum-row td:first-child{color:var(--accent-dk)}
.chg{font-size:11px;font-weight:700}
.chg.up{color:var(--accent)}
.chg.dn{color:var(--red)}
.chg.flat{color:var(--faint)}

/* ─── REPORT ─── */
.rpt{max-width:820px;margin:0 auto}
.rpt-cover{background:linear-gradient(150deg,var(--surface),var(--surface2));border:1px solid var(--border);border-radius:14px;padding:30px;margin-bottom:26px;position:relative;overflow:hidden}
.rpt-cover::before{content:'宝';position:absolute;right:-10px;bottom:-30px;font-family:var(--serif);font-weight:900;font-size:170px;color:var(--accent);opacity:.05;pointer-events:none;line-height:1}
.rpt-eyebrow{font-size:11px;color:var(--gold);letter-spacing:.18em;margin-bottom:10px;font-weight:700;font-family:var(--mono)}
.rpt-h{font-family:var(--serif);font-size:27px;font-weight:900;color:var(--ink);margin-bottom:6px;letter-spacing:.03em}
.rpt-meta{font-size:13px;color:var(--muted);margin-bottom:22px;line-height:1.7}
.rpt-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;position:relative;z-index:1}
.rpt-kpi{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:12px 14px}
.rpt-kpi-lbl{font-size:11px;color:var(--muted);margin-bottom:5px}
.rpt-kpi-val{font-size:17px;font-weight:700;font-family:var(--mono)}

.section{margin-bottom:30px}
.sec-hdr{display:flex;align-items:center;gap:11px;margin-bottom:15px}
.sec-tag{color:#fff;font-family:var(--mono);font-size:11px;font-weight:700;width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sec-title{font-family:var(--serif);font-size:17px;font-weight:700;color:var(--ink)}
.sec-p{font-size:13.5px;color:var(--t2);line-height:1.9;margin-bottom:15px}
.sec-p strong{color:var(--ink)}

.insight{background:var(--surface);border:1px solid var(--border);border-left-width:3px;border-radius:9px;padding:15px 17px;margin-bottom:12px}
.insight-hdr{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.insight-icon{font-size:16px}
.insight-title{font-size:13.5px;font-weight:700;color:var(--ink)}
.insight-body{font-size:13px;color:var(--t2);line-height:1.85}
.insight-body b{color:var(--ink)}
.pill{display:inline-block;padding:1px 8px;border-radius:5px;font-size:11px;font-weight:700;font-family:var(--mono);margin:1px 3px 1px 0}

.flag{background:var(--warn-soft);border:1px dashed var(--warn);border-radius:9px;padding:13px 16px;margin:6px 0 12px;font-size:13px;color:var(--ink);line-height:1.8}
.flag b{color:var(--warn)}

.rec-item{display:flex;gap:13px;margin-bottom:12px;background:var(--surface);border:1px solid var(--border);border-left-width:3px;border-radius:9px;padding:14px 16px}
.rec-num{width:25px;height:25px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;margin-top:1px;font-family:var(--mono)}
.rec-title{font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:5px}
.rec-body{font-size:13px;color:var(--t2);line-height:1.8}

.rpt-closing{background:var(--accent-soft);border:1px solid #cfe3d8;border-radius:11px;padding:17px 20px}
.rpt-closing-lbl{font-size:11px;color:var(--accent);letter-spacing:.1em;margin-bottom:7px;font-weight:700;font-family:var(--mono)}
.rpt-closing-body{font-size:13px;color:var(--t2);line-height:1.9}
.rpt-credit{text-align:center;font-size:11px;color:var(--faint);margin-top:16px}
.footer-note{text-align:center;font-size:11px;color:var(--faint);margin-top:24px;font-family:var(--mono)}

/* RWD */
@media(max-width:760px){
  .content,.header{padding-left:15px;padding-right:15px}
  .kpi-row{grid-template-columns:1fr 1fr}
  .g2{grid-template-columns:1fr}
  .rpt-kpis{grid-template-columns:1fr 1fr}
  .h1{font-size:22px}
  .rpt-h{font-size:22px}
}
@media(max-width:440px){
  .kpi-row{grid-template-columns:1fr}
}
</style>
</head>

<div class="back-bar">

    </div>
  </div>
  <div class="kpi-row" id="kpi-row"></div>
</div>

<div class="content">
  <!-- OVERVIEW -->
  <div class="panel active" id="panel-overview">
    <div class="card">
      <div class="card-title"><span class="dot"></span>月營收與獲利</div>
      <div class="card-sub">115年 1–6月，營收（綠）／獲利（金）對照</div>
      <div class="chart-wrap" style="height:300px"><canvas id="barMain"></canvas></div>
    </div>
    <div class="g2">

        <div class="spot-list" id="spot-list"></div>
      </div>
    </div>
  </div>

  <!-- TREND -->
  <div class="panel" id="panel-trend">
    <div class="card">
      <div class="card-title"><span class="dot"></span>營收 / 支出 / 獲利趨勢</div>
      <div class="card-sub">三線對照，看獲利與營收的缺口變化</div>
      <div class="chart-wrap" style="height:240px"><canvas id="trendPL"></canvas></div>
    </div>
    <div class="card">
      <div class="card-title"><span class="dot"></span>支出結構（堆疊）</div>
      <div class="card-sub">人事與出貨成本是兩大變動項</div>
      <div class="chart-wrap" style="height:240px"><canvas id="trendExp"></canvas></div>
    </div>
    <div class="card">
      <div class="card-title"><span class="dot"></span>主要機台月營收趨勢</div>
      <div class="card-sub">營收前 6 名機台逐月走勢</div>
      <div class="chart-wrap" style="height:260px"><canvas id="trendMachine"></canvas></div>
    </div>
  </div>

  <!-- DETAIL -->
  <div class="panel" id="panel-detail">
    <div class="card">
      <div class="card-title"><span class="dot"></span>機台 × 月 營收矩陣</div>
      <div class="card-sub">33 項機台逐月營收、6月合計與 1月→6月變化</div>
      <div class="tbl-wrap"><table id="detailTbl"></table></div>
    </div>
  </div>

  <!-- SHARE -->
  <div class="panel" id="panel-share">
    <div class="card">
      <div class="card-title"><span class="dot"></span>分潤比例</div>
      <div class="card-sub">獲利分配：Bonnie 40% ／ 高董 40% ／ 營運 20%</div>
      <div class="chart-wrap" style="height:230px"><canvas id="shareBar"></canvas></div>
    </div>
    <div class="card">
      <div class="card-title"><span class="dot"></span>各月分潤明細</div>
      <div class="card-sub">「分潤」為依當月獲利之分配；「總應收」含代墊／出貨／雜支等調整後金額（依報表分潤分配表）</div>
      <div class="tbl-wrap"><table id="shareTbl"></table></div>
    </div>
  </div>

  <!-- REPORT -->
  <div class="panel" id="panel-report">
    <div class="rpt" id="rpt"></div>
  </div>
</div>

    return `<tr><td>${m.name}</td>${m.rev.map(v=>`<td>${v?v.toLocaleString('en-US'):'<span style="color:#bbb">0</span>'}</td>`).join('')}<td><b>${m.total.toLocaleString('en-US')}</b></td><td><span class="chg ${cls}">${chg}</span></td></tr>`;
  }).join('');
  const t=DATA.totals;
  const totRow=`<tr class="sum-row"><td>營收合計</td>${t.rev.map(v=>`<td>${v.toLocaleString('en-US')}</td>`).join('')}<td>${sum(t.rev).toLocaleString('en-US')}</td><td></td></tr>`;

    <div class="sec-hdr"><span class="sec-tag" style="background:var(--blue)">04</span><span class="sec-title">後續營運建議</span></div>
    <div class="rec-item" style="border-left-color:var(--accent)"><div class="rec-num" style="background:var(--accent-soft);color:var(--accent)">1</div><div><div class="rec-title">雨季期間以成本控制維持獲利率</div><div class="rec-body">6月雨季驗證了「低營收 + 嚴控支出」可守住獲利率的策略。建議 7–8月雨季延續此節奏：壓縮非必要備貨、人事彈性調度，避免重蹈 5月高成本壓獲利的模式。</div></div></div>
    <div class="rec-item" style="border-left-color:var(--gold)"><div class="rec-num" style="background:var(--gold-soft);color:var(--gold)">2</div><div><div class="rec-title">娃娃機列為第一級維護對象</div><div class="rec-body">單機占全店逾半，建議建立補貨、出獎率與機況的固定巡檢節奏，把波動風險控制在最大營收來源上。</div></div></div>
    <div class="rec-item" style="border-left-color:var(--red)"><div class="rec-num" style="background:var(--red-soft);color:var(--red)">3</div><div><div class="rec-title">衰退機台檢討 / 汰換</div><div class="rec-body">Mini機、蛋大俠先查原因（機況／位置／競品）；射擊機、幸運星營收長期低迷，評估更換機種或挪移黃金動線。</div></div></div>
    <div class="rec-item" style="border-left-color:var(--blue)"><div class="rec-num" style="background:#eef2f3;color:var(--blue)">4</div><div><div class="rec-title">依季節調整備貨與檔期</div><div class="rec-body">寒暑假／連假為高峰、雨季為低點；雨季主推室內體感機台（籃球機、曲棍球），並把出貨備貨節奏對齊高峰月，避免淡季囤貨壓獲利。</div></div></div>
  </div>

  <div class="rpt-closing">
    <div class="rpt-closing-lbl">小結</div>
    <div class="rpt-closing-body">1–6月整體營收健康，娃娃機為核心引擎，平均獲利率穩定維持在 39% 上下。5月高成本已確認為前置備貨性質，非結構性問題；6月雨季以低支出守住獲利率，成本控制策略見效。後續重點在於衰退機台的現場診斷，以及暑假旺季的備貨與人力配置節奏。</div>
  </div>
  <div class="rpt-credit">曜森原行銷 · 漁人町業務系統　｜　資料來源：11501–11506 營收報表</div>`;
}

/* ===== tabs ===== */
let built={overview:false,trend:false,detail:false,share:false,report:false};
function switchTab(name,btn){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b=>{b.classList.remove('active');b.classList.remove('report-active')});
  if(name==='report'){btn.classList.add('report-active')}else{btn.classList.add('active')}
  if(name==='trend'&&!built.trend){trendPL();trendExp();trendMachine();built.trend=true}
  if(name==='detail'&&!built.detail){detailTbl();built.detail=true}
  if(name==='share'&&!built.share){shareBar();shareTbl();built.share=true}
  if(name==='report'&&!built.report){renderReport();built.report=true}
}

/* init */
document.getElementById('h-sub').innerHTML=`${DATA.meta.year} <b>1–5月</b>　｜　${DATA.meta.store}　｜　幣別 ${DATA.meta.unit}`;
renderKPI();barMain();renderMpick();renderRank();renderSpots();built.overview=true;
</script>
